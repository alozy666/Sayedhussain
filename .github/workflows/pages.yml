name: نشر الموقع على GitHub Pages

# عند كل دفع إلى الفرع الرئيسي للمستودع: اختبارات ثم بناء ثم نشر إلى فرع gh-pages
# (يخدمه GitHub Pages تلقائيًا على https://alozy666.github.io/Sayedhussain/).
on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:single
      - run: cp dist-single/index.html ali-explorer-offline.html
      - run: npm run build
      - run: |
          cp ali-explorer-offline.html dist/
          touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
